name: Sync Upstream Daily

on:
  schedule:
    - cron: '40 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch China CSV files only
        run: |
          for f in CN telecom unicom mobile; do
            curl -fsSL -o ${f}.csv "https://raw.githubusercontent.com/spiritLHLS/speedtest.cn-CN-ID/main/${f}.csv" || echo "skip ${f}"
          done
      - name: Update README timestamp
        run: |
          sed -i "s#^数据更新时间:.*#数据更新时间: $(date +%Y/%m/%d)#" README.md || true
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync upstream CN speedtest nodes $(date +%Y/%m/%d)"
          git push
